// ---------- constants ----------

const PALETTE = [
  { base: "#3B6EA5", dim: "#274a6e", label: "steel" }, // steel blue
  { base: "#B4432E", dim: "#7a2d1f", label: "iron" }, // iron rust
  { base: "#4C7A52", dim: "#33533a", label: "moss" }, // moss green
  { base: "#8A5A3B", dim: "#5c3c27", label: "bronze" }, // bronze
  { base: "#6B4C7A", dim: "#483253", label: "plum" }, // plum
  { base: "#A38A2E", dim: "#6d5c1f", label: "brass" }, // brass
];

const DEFAULT_SETTINGS = {
  unit: "kg",
  splits: [
    {
      id: "split-upper",
      name: "Upper",
      exercises: [
        { id: "ex-bench", name: "Bench Press", reps: "4x8", weight: 60 },
        { id: "ex-row", name: "Bent-Over Row", reps: "4x8", weight: 50 },
        { id: "ex-ohp", name: "Overhead Press", reps: "3x10", weight: 35 },
        { id: "ex-lat", name: "Lat Pulldown", reps: "3x12", weight: 45 },
        { id: "ex-curl", name: "Bicep Curl", reps: "3x12", weight: 15 },
      ],
    },
    {
      id: "split-lower",
      name: "Lower",
      exercises: [
        { id: "ex-squat", name: "Back Squat", reps: "4x8", weight: 80 },
        { id: "ex-rdl", name: "Romanian Deadlift", reps: "3x10", weight: 70 },
        { id: "ex-legpress", name: "Leg Press", reps: "3x12", weight: 120 },
        { id: "ex-calf", name: "Calf Raise", reps: "4x15", weight: 60 },
      ],
    },
  ],
};

const DEFAULT_STATE = { currentIndex: 0, sessionStartedAt: null };

const FONT_IMPORT = `
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');
`;

function uid(prefix) {
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

// ---------- storage helpers ----------

const STORAGE_PREFIX = "gym-tracker:";

async function loadKey(key, fallback) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    if (raw) return JSON.parse(raw);
    return fallback;
  } catch (e) {
    return fallback;
  }
}

async function saveKey(key, value) {
  try {
    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
  } catch (e) {
    // swallow - non-fatal (e.g. private browsing storage limits)
    console.error("storage save failed", key, e);
  }
}

// ---------- main component ----------

function GymTracker() {
  const [loading, setLoading] = useState(true);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [dayState, setDayState] = useState(DEFAULT_STATE);
  const [history, setHistory] = useState([]);
  const [notes, setNotes] = useState({});
  const [tab, setTab] = useState("home");
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  useEffect(() => {
    (async () => {
      const [s, st, h, n] = await Promise.all([
        loadKey("settings", null),
        loadKey("state", null),
        loadKey("history", []),
        loadKey("notes", {}),
      ]);
      let finalSettings = s;
      if (!finalSettings) {
        finalSettings = DEFAULT_SETTINGS;
        await saveKey("settings", finalSettings);
      }
      let finalState = st;
      if (!finalState) {
        finalState = DEFAULT_STATE;
        await saveKey("state", finalState);
      }
      // clamp index in case splits were edited elsewhere
      if (finalState.currentIndex >= finalSettings.splits.length) {
        finalState = { ...finalState, currentIndex: 0 };
      }
      if (!finalState.sessionStartedAt) {
        finalState = { ...finalState, sessionStartedAt: new Date().toISOString() };
        await saveKey("state", finalState);
      }
      setSettings(finalSettings);
      setDayState(finalState);
      setHistory(h || []);
      setNotes(n || {});
      setLoading(false);
    })();
  }, []);

  const showToast = useCallback((msg) => {
    setToast(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2200);
  }, []);

  const persistSettings = useCallback((next) => {
    setSettings(next);
    saveKey("settings", next);
  }, []);

  const persistState = useCallback((next) => {
    setDayState(next);
    saveKey("state", next);
  }, []);

  const persistHistory = useCallback((next) => {
    setHistory(next);
    saveKey("history", next);
  }, []);

  const persistNotes = useCallback((next) => {
    setNotes(next);
    saveKey("notes", next);
  }, []);

  if (loading) {
    return (
      <div style={styles.appShell}>
        <style>{FONT_IMPORT}</style>
        <div style={{ ...styles.centerFull, color: TOKENS.textDim, fontFamily: "Inter, sans-serif" }}>
          Loading…
        </div>
      </div>
    );
  }

  const safeIndex = settings.splits.length
    ? dayState.currentIndex % settings.splits.length
    : 0;
  const currentSplit = settings.splits[safeIndex];
  const accent = PALETTE[safeIndex % PALETTE.length];

  return (
    <div style={styles.appShell}>
      <style>{FONT_IMPORT}</style>
      <div style={styles.phoneFrame}>
        <div style={styles.screen}>
          {tab === "home" && (
            <HomeTab
              settings={settings}
              currentSplit={currentSplit}
              splitIndex={safeIndex}
              accent={accent}
              persistSettings={persistSettings}
              persistState={persistState}
              persistHistory={persistHistory}
              history={history}
              dayState={dayState}
              notes={notes}
              persistNotes={persistNotes}
              showToast={showToast}
            />
          )}
          {tab === "history" && <HistoryTab history={history} unit={settings.unit} showToast={showToast} />}
          {tab === "settings" && (
            <SettingsTab settings={settings} persistSettings={persistSettings} dayState={dayState} persistState={persistState} />
          )}
        </div>
        <TabBar tab={tab} setTab={setTab} />
        {toast && <div style={styles.toast}>{toast}</div>}
      </div>
    </div>
  );
}

// ---------- Home Tab ----------

function HomeTab({
  settings,
  currentSplit,
  splitIndex,
  accent,
  persistSettings,
  persistState,
  persistHistory,
  history,
  dayState,
  notes,
  persistNotes,
  showToast,
}) {
  const [editingId, setEditingId] = useState(null);
  const [noteExerciseId, setNoteExerciseId] = useState(null);
  const [confirmFinish, setConfirmFinish] = useState(false);

  if (!settings.splits.length) {
    return (
      <EmptyState
        title="No splits yet"
        body="Head to Settings to add your first training day and exercises."
      />
    );
  }

  const updateWeight = (exerciseId, newWeight) => {
    const nextSplits = settings.splits.map((sp, i) => {
      if (i !== splitIndex) return sp;
      return {
        ...sp,
        exercises: sp.exercises.map((ex) =>
          ex.id === exerciseId ? { ...ex, weight: newWeight } : ex
        ),
      };
    });
    persistSettings({ ...settings, splits: nextSplits });
  };

  const finishWorkout = () => {
    const cutoff = dayState.sessionStartedAt || 0;
    const session = {
      id: uid("session"),
      date: new Date().toISOString(),
      splitId: currentSplit.id,
      splitName: currentSplit.name,
      exercises: currentSplit.exercises.map((ex) => ({
        id: ex.id,
        name: ex.name,
        reps: ex.reps,
        weight: ex.weight,
        // snapshot only the notes taken since this session started
        notes: (notes[ex.id] || [])
          .filter((n) => n.date >= cutoff)
          .slice()
          .reverse()
          .map((n) => n.text),
      })),
    };
    persistHistory([session, ...history]);
    const nextIndex = (splitIndex + 1) % settings.splits.length;
    persistState({ ...dayState, currentIndex: nextIndex, sessionStartedAt: new Date().toISOString() });
    setConfirmFinish(false);
    showToast(`${currentSplit.name} day logged. Next up: ${settings.splits[nextIndex].name}.`);
  };

  const lastSessionForSplit = history.find((h) => h.splitId === currentSplit.id);

  return (
    <div style={{ padding: "28px 20px 20px" }}>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: 22 }}>
        <span
          style={{
            fontFamily: "JetBrains Mono, monospace",
            fontSize: 11,
            letterSpacing: 3,
            color: TOKENS.textDim,
            textTransform: "uppercase",
            marginBottom: 14,
          }}
        >
          Today's session
        </span>
        <PlateBadge name={currentSplit.name} accent={accent} />
        {lastSessionForSplit && (
          <span style={{ marginTop: 12, fontSize: 12, color: TOKENS.textDim, fontFamily: "Inter, sans-serif" }}>
            Last {currentSplit.name.toLowerCase()} session: {formatDate(lastSessionForSplit.date)}
          </span>
        )}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {currentSplit.exercises.map((ex) => (
          <ExerciseRow
            key={ex.id}
            exercise={ex}
            unit={settings.unit}
            accent={accent}
            editing={editingId === ex.id}
            onToggleEdit={() => setEditingId(editingId === ex.id ? null : ex.id)}
            onChangeWeight={(w) => updateWeight(ex.id, w)}
            noteCount={(notes[ex.id] || []).length}
            onOpenNotes={() => setNoteExerciseId(ex.id)}
          />
        ))}
      </div>

      <button
        onClick={() => setConfirmFinish(true)}
        style={{
          marginTop: 24,
          width: "100%",
          padding: "16px 0",
          borderRadius: 14,
          border: "none",
          background: TOKENS.accentYellow,
          color: "#1A1400",
          fontFamily: "Oswald, sans-serif",
          fontWeight: 600,
          fontSize: 16,
          letterSpacing: 1,
          textTransform: "uppercase",
          cursor: "pointer",
        }}
      >
        Finish workout
      </button>

      {confirmFinish && (
        <ConfirmModal
          title={`Log ${currentSplit.name} day?`}
          body={`This saves today's weights to your history and switches your next session to ${
            settings.splits[(splitIndex + 1) % settings.splits.length].name
          } day.`}
          confirmLabel="Log it"
          onConfirm={finishWorkout}
          onCancel={() => setConfirmFinish(false)}
        />
      )}

      {noteExerciseId && (
        <NotesModal
          exercise={currentSplit.exercises.find((e) => e.id === noteExerciseId)}
          notesForExercise={notes[noteExerciseId] || []}
          onAddNote={(text) => {
            const entry = { id: uid("note"), date: new Date().toISOString(), text };
            const next = { ...notes, [noteExerciseId]: [entry, ...(notes[noteExerciseId] || [])] };
            persistNotes(next);
          }}
          onDeleteNote={(noteId) => {
            const next = {
              ...notes,
              [noteExerciseId]: (notes[noteExerciseId] || []).filter((n) => n.id !== noteId),
            };
            persistNotes(next);
          }}
          onClose={() => setNoteExerciseId(null)}
        />
      )}
    </div>
  );
}

function ExerciseRow({ exercise, unit, accent, editing, onToggleEdit, onChangeWeight, noteCount, onOpenNotes }) {
  const [draft, setDraft] = useState(exercise.weight);

  useEffect(() => {
    setDraft(exercise.weight);
  }, [exercise.weight, editing]);

  const step = unit === "kg" ? 2.5 : 5;

  const commit = (val) => {
    const num = Math.max(0, Number(val) || 0);
    onChangeWeight(num);
  };

  return (
    <div
      style={{
        background: TOKENS.surface,
        border: `1px solid ${TOKENS.border}`,
        borderLeft: `3px solid ${accent.base}`,
        borderRadius: 12,
        padding: "14px 14px",
      }}
    >
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
        <div style={{ minWidth: 0, flex: 1 }}>
          <div
            style={{
              fontFamily: "Inter, sans-serif",
              fontWeight: 600,
              fontSize: 15,
              color: TOKENS.text,
              overflow: "hidden",
              textOverflow: "ellipsis",
              whiteSpace: "nowrap",
            }}
          >
            {exercise.name}
          </div>
          <div style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, color: TOKENS.textDim, marginTop: 3 }}>
            {exercise.reps}
          </div>
        </div>

        <button
          onClick={onOpenNotes}
          style={{
            background: "transparent",
            border: "none",
            color: noteCount ? TOKENS.accentYellow : TOKENS.textDim,
            display: "flex",
            alignItems: "center",
            gap: 4,
            fontSize: 12,
            fontFamily: "JetBrains Mono, monospace",
            cursor: "pointer",
            padding: 6,
          }}
          aria-label="Exercise notes"
        >
          <StickyNote size={16} />
          {noteCount > 0 && <span>{noteCount}</span>}
        </button>
      </div>

      <div style={{ marginTop: 10 }}>
        {!editing ? (
          <button
            onClick={onToggleEdit}
            style={{
              width: "100%",
              display: "flex",
              alignItems: "center",
              justifyContent: "space-between",
              background: TOKENS.surface2,
              border: `1px solid ${TOKENS.border}`,
              borderRadius: 10,
              padding: "10px 12px",
              cursor: "pointer",
            }}
          >
            <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 18, fontWeight: 700, color: TOKENS.text }}>
              {exercise.weight} <span style={{ fontSize: 12, color: TOKENS.textDim }}>{unit}</span>
            </span>
            <Pencil size={14} color={TOKENS.textDim} />
          </button>
        ) : (
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <StepButton
              icon={<Minus size={16} />}
              onClick={() => {
                const next = Math.max(0, Number(draft) - step);
                setDraft(next);
                commit(next);
              }}
            />
            <input
              type="number"
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              onBlur={(e) => commit(e.target.value)}
              style={{
                flex: 1,
                textAlign: "center",
                background: TOKENS.surface2,
                border: `1px solid ${accent.base}`,
                borderRadius: 10,
                padding: "10px 6px",
                fontFamily: "JetBrains Mono, monospace",
                fontSize: 18,
                fontWeight: 700,
                color: TOKENS.text,
              }}
            />
            <StepButton
              icon={<Plus size={16} />}
              onClick={() => {
                const next = Number(draft) + step;
                setDraft(next);
                commit(next);
              }}
            />
            <button
              onClick={() => {
                commit(draft);
                onToggleEdit();
              }}
              style={{
                background: TOKENS.accentYellow,
                border: "none",
                borderRadius: 10,
                padding: "10px 12px",
                cursor: "pointer",
                display: "flex",
                alignItems: "center",
              }}
              aria-label="Done editing weight"
            >
              <Check size={16} color="#1A1400" />
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- History tab ----------

function sessionToPlainText(session, unit) {
  const lines = [];
  lines.push(`${session.splitName} day — ${formatDate(session.date)} ${formatTime(session.date)}`);
  session.exercises.forEach((ex) => {
    lines.push(`${ex.name} — ${ex.reps} @ ${ex.weight}${unit}`);
    (ex.notes || []).forEach((note) => {
      lines.push(`  - ${note}`);
    });
  });
  return lines.join("\n");
}

async function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    await navigator.clipboard.writeText(text);
    return true;
  }
  // fallback for restricted environments
  const el = document.createElement("textarea");
  el.value = text;
  el.style.position = "fixed";
  el.style.opacity = "0";
  document.body.appendChild(el);
  el.focus();
  el.select();
  let ok = false;
  try {
    ok = document.execCommand("copy");
  } catch (e) {
    ok = false;
  }
  document.body.removeChild(el);
  if (!ok) throw new Error("copy failed");
  return true;
}

function HistoryTab({ history, unit, showToast }) {
  const [openId, setOpenId] = useState(null);
  const [copiedId, setCopiedId] = useState(null);

  if (!history.length) {
    return (
      <EmptyState
        title="No sessions logged yet"
        body="Finish a workout from the Home tab and it'll show up here."
      />
    );
  }

  const handleCopy = async (session) => {
    const text = sessionToPlainText(session, unit);
    try {
      await copyText(text);
      setCopiedId(session.id);
      showToast && showToast("Copied to clipboard");
      setTimeout(() => setCopiedId((c) => (c === session.id ? null : c)), 1800);
    } catch (e) {
      showToast && showToast("Couldn't copy — try again");
    }
  };

  return (
    <div style={{ padding: "24px 20px" }}>
      <h2 style={headerStyle}>History</h2>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 16 }}>
        {history.map((session) => {
          const isOpen = openId === session.id;
          const accent = PALETTE[hashToIndex(session.splitId)];
          const justCopied = copiedId === session.id;
          return (
            <div
              key={session.id}
              style={{
                background: TOKENS.surface,
                border: `1px solid ${TOKENS.border}`,
                borderLeft: `3px solid ${accent.base}`,
                borderRadius: 12,
                overflow: "hidden",
              }}
            >
              <div style={{ display: "flex", alignItems: "center" }}>
                <button
                  onClick={() => setOpenId(isOpen ? null : session.id)}
                  style={{
                    flex: 1,
                    background: "transparent",
                    border: "none",
                    padding: "14px 14px",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "space-between",
                    cursor: "pointer",
                    minWidth: 0,
                  }}
                >
                  <div style={{ textAlign: "left", minWidth: 0 }}>
                    <div style={{ fontFamily: "Oswald, sans-serif", fontSize: 15, textTransform: "uppercase", letterSpacing: 0.5, color: TOKENS.text }}>
                      {session.splitName} day
                    </div>
                    <div style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12, color: TOKENS.textDim, marginTop: 2 }}>
                      {formatDate(session.date)} · {formatTime(session.date)}
                    </div>
                  </div>
                  <ChevronRight
                    size={18}
                    color={TOKENS.textDim}
                    style={{ transform: isOpen ? "rotate(90deg)" : "none", transition: "transform 0.15s", flexShrink: 0, marginLeft: 8 }}
                  />
                </button>
                <button
                  onClick={() => handleCopy(session)}
                  style={{
                    background: "transparent",
                    border: "none",
                    color: justCopied ? TOKENS.accentYellow : TOKENS.textDim,
                    cursor: "pointer",
                    padding: "14px 14px 14px 6px",
                    flexShrink: 0,
                  }}
                  aria-label="Copy session as plain text"
                >
                  {justCopied ? <ClipboardCheck size={17} /> : <Copy size={17} />}
                </button>
              </div>
              {isOpen && (
                <div style={{ padding: "0 14px 14px", display: "flex", flexDirection: "column", gap: 8 }}>
                  {session.exercises.map((ex) => (
                    <div
                      key={ex.id}
                      style={{
                        borderTop: `1px solid ${TOKENS.border}`,
                        paddingTop: 6,
                      }}
                    >
                      <div
                        style={{
                          display: "flex",
                          justifyContent: "space-between",
                          fontSize: 13,
                          fontFamily: "Inter, sans-serif",
                          color: TOKENS.text,
                        }}
                      >
                        <span>{ex.name}</span>
                        <span style={{ fontFamily: "JetBrains Mono, monospace", color: TOKENS.textDim }}>
                          {ex.reps} @ {ex.weight}
                        </span>
                      </div>
                      {(ex.notes || []).length > 0 && (
                        <div style={{ marginTop: 4, display: "flex", flexDirection: "column", gap: 2 }}>
                          {ex.notes.map((n, i) => (
                            <div key={i} style={{ fontSize: 12, color: TOKENS.textDim, fontFamily: "Inter, sans-serif", paddingLeft: 10 }}>
                              — {n}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function hashToIndex(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h % PALETTE.length;
}

// ---------- Settings tab ----------

function SettingsTab({ settings, persistSettings, dayState, persistState }) {
  const [openSplitId, setOpenSplitId] = useState(settings.splits[0]?.id || null);

  const updateSplits = (splits) => persistSettings({ ...settings, splits });

  const addSplit = () => {
    const newSplit = { id: uid("split"), name: "New Day", exercises: [] };
    updateSplits([...settings.splits, newSplit]);
    setOpenSplitId(newSplit.id);
  };

  const removeSplit = (splitId) => {
    const idx = settings.splits.findIndex((s) => s.id === splitId);
    const next = settings.splits.filter((s) => s.id !== splitId);
    updateSplits(next);
    if (idx <= dayState.currentIndex && dayState.currentIndex > 0) {
      persistState({ ...dayState, currentIndex: dayState.currentIndex - 1 });
    }
  };

  const renameSplit = (splitId, name) => {
    updateSplits(settings.splits.map((s) => (s.id === splitId ? { ...s, name } : s)));
  };

  const moveSplit = (index, dir) => {
    const next = [...settings.splits];
    const target = index + dir;
    if (target < 0 || target >= next.length) return;
    [next[index], next[target]] = [next[target], next[index]];
    updateSplits(next);
  };

  const addExercise = (splitId) => {
    updateSplits(
      settings.splits.map((s) =>
        s.id === splitId
          ? { ...s, exercises: [...s.exercises, { id: uid("ex"), name: "New Exercise", reps: "3x10", weight: 0 }] }
          : s
      )
    );
  };

  const updateExercise = (splitId, exId, patch) => {
    updateSplits(
      settings.splits.map((s) =>
        s.id !== splitId
          ? s
          : { ...s, exercises: s.exercises.map((ex) => (ex.id === exId ? { ...ex, ...patch } : ex)) }
      )
    );
  };

  const removeExercise = (splitId, exId) => {
    updateSplits(
      settings.splits.map((s) =>
        s.id !== splitId ? s : { ...s, exercises: s.exercises.filter((ex) => ex.id !== exId) }
      )
    );
  };

  return (
    <div style={{ padding: "24px 20px" }}>
      <h2 style={headerStyle}>Settings</h2>

      <div style={{ marginTop: 18, marginBottom: 22 }}>
        <label style={labelStyle}>Weight unit</label>
        <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
          {["kg", "lb"].map((u) => (
            <button
              key={u}
              onClick={() => persistSettings({ ...settings, unit: u })}
              style={{
                flex: 1,
                padding: "10px 0",
                borderRadius: 10,
                border: `1px solid ${settings.unit === u ? TOKENS.accentYellow : TOKENS.border}`,
                background: settings.unit === u ? "rgba(227,178,60,0.12)" : TOKENS.surface,
                color: settings.unit === u ? TOKENS.accentYellow : TOKENS.textDim,
                fontFamily: "JetBrains Mono, monospace",
                fontWeight: 600,
                cursor: "pointer",
              }}
            >
              {u}
            </button>
          ))}
        </div>
      </div>

      <label style={labelStyle}>Training days (cycle order)</label>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 8 }}>
        {settings.splits.map((split, idx) => {
          const isOpen = openSplitId === split.id;
          const accent = PALETTE[idx % PALETTE.length];
          const isCurrent = idx === dayState.currentIndex % Math.max(settings.splits.length, 1);
          return (
            <div
              key={split.id}
              style={{
                background: TOKENS.surface,
                border: `1px solid ${TOKENS.border}`,
                borderLeft: `3px solid ${accent.base}`,
                borderRadius: 12,
                overflow: "hidden",
              }}
            >
              <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "12px 12px" }}>
                <div style={{ display: "flex", flexDirection: "column" }}>
                  <button
                    onClick={() => moveSplit(idx, -1)}
                    disabled={idx === 0}
                    style={miniArrowStyle(idx === 0)}
                    aria-label="Move up"
                  >
                    <ChevronUp size={13} />
                  </button>
                  <button
                    onClick={() => moveSplit(idx, 1)}
                    disabled={idx === settings.splits.length - 1}
                    style={miniArrowStyle(idx === settings.splits.length - 1)}
                    aria-label="Move down"
                  >
                    <ChevronDown size={13} />
                  </button>
                </div>

                <input
                  value={split.name}
                  onChange={(e) => renameSplit(split.id, e.target.value)}
                  style={{
                    flex: 1,
                    background: "transparent",
                    border: "none",
                    color: TOKENS.text,
                    fontFamily: "Oswald, sans-serif",
                    fontSize: 16,
                    textTransform: "uppercase",
                    letterSpacing: 0.5,
                    outline: "none",
                  }}
                />

                {isCurrent && (
                  <span
                    style={{
                      fontSize: 10,
                      fontFamily: "JetBrains Mono, monospace",
                      color: TOKENS.accentYellow,
                      border: `1px solid ${TOKENS.accentYellow}`,
                      borderRadius: 999,
                      padding: "2px 8px",
                      flexShrink: 0,
                    }}
                  >
                    UP NEXT
                  </span>
                )}

                <button
                  onClick={() => setOpenSplitId(isOpen ? null : split.id)}
                  style={{ background: "transparent", border: "none", color: TOKENS.textDim, cursor: "pointer" }}
                  aria-label="Expand split"
                >
                  <ChevronRight size={18} style={{ transform: isOpen ? "rotate(90deg)" : "none", transition: "transform 0.15s" }} />
                </button>
              </div>

              {isOpen && (
                <div style={{ padding: "0 12px 14px", display: "flex", flexDirection: "column", gap: 8 }}>
                  {split.exercises.map((ex) => (
                    <div
                      key={ex.id}
                      style={{
                        background: TOKENS.surface2,
                        border: `1px solid ${TOKENS.border}`,
                        borderRadius: 10,
                        padding: 10,
                        display: "flex",
                        flexDirection: "column",
                        gap: 6,
                      }}
                    >
                      <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                        <input
                          value={ex.name}
                          onChange={(e) => updateExercise(split.id, ex.id, { name: e.target.value })}
                          style={inputStyle}
                          placeholder="Exercise name"
                        />
                        <button
                          onClick={() => removeExercise(split.id, ex.id)}
                          style={{ background: "transparent", border: "none", color: TOKENS.danger, cursor: "pointer", flexShrink: 0 }}
                          aria-label="Remove exercise"
                        >
                          <Trash2 size={15} />
                        </button>
                      </div>
                      <div style={{ display: "flex", gap: 6 }}>
                        <input
                          value={ex.reps}
                          onChange={(e) => updateExercise(split.id, ex.id, { reps: e.target.value })}
                          style={{ ...inputStyle, flex: 1 }}
                          placeholder="Sets x reps"
                        />
                        <input
                          type="number"
                          value={ex.weight}
                          onChange={(e) => updateExercise(split.id, ex.id, { weight: Number(e.target.value) || 0 })}
                          style={{ ...inputStyle, width: 84, textAlign: "center" }}
                          placeholder="Weight"
                        />
                      </div>
                    </div>
                  ))}

                  <button
                    onClick={() => addExercise(split.id)}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      gap: 6,
                      background: "transparent",
                      border: `1px dashed ${TOKENS.border}`,
                      borderRadius: 10,
                      padding: "9px 0",
                      color: TOKENS.textDim,
                      fontFamily: "Inter, sans-serif",
                      fontSize: 13,
                      cursor: "pointer",
                    }}
                  >
                    <Plus size={14} /> Add exercise
                  </button>

                  <button
                    onClick={() => removeSplit(split.id)}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      gap: 6,
                      background: "transparent",
                      border: "none",
                      color: TOKENS.danger,
                      fontFamily: "Inter, sans-serif",
                      fontSize: 12,
                      cursor: "pointer",
                      marginTop: 2,
                    }}
                  >
                    <Trash2 size={13} /> Delete this day
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <button
        onClick={addSplit}
        style={{
          marginTop: 14,
          width: "100%",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          gap: 6,
          background: TOKENS.surface,
          border: `1px dashed ${TOKENS.border}`,
          borderRadius: 12,
          padding: "13px 0",
          color: TOKENS.text,
          fontFamily: "Inter, sans-serif",
          fontSize: 14,
          cursor: "pointer",
        }}
      >
        <Plus size={16} /> Add training day
      </button>
    </div>
  );
}

  return {
    background: "transparent",
    border: "none",
    color: disabled ? "#4A4C52" : TOKENS.textDim,
    cursor: disabled ? "default" : "pointer",
    padding: 1,
  };
}

  background: TOKENS.surface,
  border: `1px solid ${TOKENS.border}`,

  fontFamily: "Inter, sans-serif",

  textTransform: "uppercase",
